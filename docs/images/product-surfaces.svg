        <g class="cell"><text x="14" y="68" fill="#177b61">181dda20</text><text x="119" y="68">90</text><text x="178" y="68">Declined</text><text x="14" y="108" fill="#177b61">bc440874</text><text x="119" y="108">65</text><text x="178" y="108">Flagged</text><text x="14" y="148" fill="#177b61">705451fc</text><text x="119" y="148">35</text><text x="178" y="148">Approved</text><text x="14" y="188" fill="#177b61">e63d09e8</text><text x="119" y="188">55</text><text x="178" y="188">Flagged</text></g>
        <g><rect x="112" y="54" width="26" height="20" rx="6" fill="#fde3e7"/><rect x="112" y="94" width="26" height="20" rx="6" fill="#fae3d9"/><rect x="112" y="134" width="26" height="20" rx="6" fill="#e1f2dd"/><rect x="112" y="174" width="26" height="20" rx="6" fill="#fff0bf"/></g>
