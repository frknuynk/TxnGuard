<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TxnGuard operations dashboard surfaces</title>
  <desc id="desc">Illustrated overview, transactions, and fraud-review surfaces from the TxnGuard merchant dashboard.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8f6"/><stop offset="1" stop-color="#e6eeea"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d251d"/><stop offset="1" stop-color="#14392d"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#176b55"/><stop offset="1" stop-color="#1e483b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#15352a" flood-opacity=".16"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183b2f" flood-opacity=".12"/></filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .caption { fill:#587066; font-size:15px; font-weight:700; letter-spacing:2px; }
      .title { fill:#11241c; font-size:30px; font-weight:750; letter-spacing:-.8px; }
      .copy { fill:#667b72; font-size:15px; }
      .navcopy { fill:#b9cec5; font-size:14px; font-weight:650; }
      .tiny { fill:#789087; font-size:11px; font-weight:750; letter-spacing:1.2px; }
      .label { fill:#49635a; font-size:13px; font-weight:650; }
      .value { fill:#14271f; font-size:26px; font-weight:760; letter-spacing:-.6px; }
      .tablehead { fill:#70857c; font-size:10px; font-weight:750; letter-spacing:1.2px; }
      .cell { fill:#29453a; font-size:12px; font-weight:650; }
      .muted { fill:#6b8177; font-size:12px; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#canvas)"/>
  <g class="ui">
    <text x="94" y="92" class="caption">TXNGUARD PRODUCT SURFACES</text>
    <text x="94" y="140" class="title" style="font-size:38px">One merchant workspace, from decision to investigation.</text>
    <text x="94" y="170" class="copy">Illustrated from the local product experience — overview, transaction review, and fraud triage.</text>

    <g transform="translate(94 224)" filter="url(#shadow)">
      <rect width="392" height="548" rx="18" fill="#fbfcfb"/>
      <rect width="104" height="548" rx="18" fill="url(#nav)"/>
      <rect x="86" width="18" height="548" fill="url(#nav)"/>
      <circle cx="32" cy="34" r="14" fill="#050a08" stroke="#386353"/>
      <text x="27" y="39" fill="white" font-size="14" font-weight="800">N</text>
      <text x="17" y="82" class="navcopy" style="font-size:10px">OVERVIEW</text>
      <rect x="11" y="98" width="82" height="38" rx="9" fill="url(#active)" stroke="#5fe4b5" stroke-opacity=".45"/>
      <text x="23" y="121" fill="white" font-size="11" font-weight="700">Dashboard</text>
      <text x="17" y="168" class="navcopy" style="font-size:10px">PAYMENTS</text>
      <text x="17" y="200" class="navcopy" style="font-size:10px">FRAUD</text>
      <text x="17" y="232" class="navcopy" style="font-size:10px">SETTINGS</text>
      <circle cx="32" cy="505" r="16" fill="#d5f2e6"/><text x="24" y="510" fill="#17634d" font-size="10" font-weight="800">TH</text>
