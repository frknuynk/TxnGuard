      <circle cx="352" cy="149" r="4" fill="#36b681"/><text x="321" y="174" fill="#588276" font-size="10" font-weight="700">Live queue</text>
      <g transform="translate(122 218)"><rect width="252" height="270" rx="12" fill="#fff" stroke="#dfebe5"/>
        <text x="14" y="27" class="tablehead">TRANSACTION</text><text x="119" y="27" class="tablehead">RISK</text><text x="178" y="27" class="tablehead">STATUS</text>
        <g stroke="#e9efec"><path d="M0 43H252"/><path d="M0 83H252"/><path d="M0 123H252"/><path d="M0 163H252"/><path d="M0 203H252"/></g>
        <g class="cell"><text x="14" y="68" fill="#177b61">181dda20</text><text x="119" y="68">90 critical</text><text x="178" y="68">Declined</text><text x="14" y="108" fill="#177b61">bc440874</text><text x="119" y="108">65 high</text><text x="178" y="108">Flagged</text><text x="14" y="148" fill="#177b61">e63d09e8</text><text x="119" y="148">55 medium</text><text x="178" y="148">Flagged</text><text x="14" y="188" fill="#177b61">86493c1c</text><text x="119" y="188">90 critical</text><text x="178" y="188">Declined</text></g>
      </g>
      <rect x="122" y="511" width="252" height="1" fill="#e4ece8"/><text x="122" y="535" class="muted" style="font-size:10px">9 results  ·  Page 1 of 1</text>
