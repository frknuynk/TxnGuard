      <circle cx="32" cy="34" r="14" fill="#050a08" stroke="#386353"/><text x="27" y="39" fill="white" font-size="14" font-weight="800">N</text>
      <text x="17" y="82" class="navcopy" style="font-size:10px">OVERVIEW</text><text x="17" y="114" class="navcopy" style="font-size:10px">PAYMENTS</text><text x="17" y="146" class="navcopy" style="font-size:10px">FRAUD</text>
      <rect x="11" y="162" width="82" height="38" rx="9" fill="url(#active)" stroke="#5fe4b5" stroke-opacity=".45"/><text x="25" y="185" fill="white" font-size="11" font-weight="700">Review</text>
      <text x="17" y="230" class="navcopy" style="font-size:10px">SETTINGS</text>
      <text x="122" y="42" class="tiny">INVESTIGATION QUEUE</text><text x="122" y="77" class="title">Fraud review</text><text x="122" y="102" class="copy" style="font-size:12px">Flagged and declined payments first.</text>
      <rect x="122" y="125" width="252" height="69" rx="12" fill="#fffaf0" stroke="#f0dfb8"/>
